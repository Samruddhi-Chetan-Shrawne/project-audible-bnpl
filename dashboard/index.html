<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Audible Dashboard</title>
<script src="vendor/plotly-2.35.2.min.js"></script>
<script src="data.js"></script>
<style>
  :root {
    color-scheme: light;
    --page: #f6f7f9;
    --surface: #ffffff;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #7a7974;
    --grid: #e6e5df;
    --axis: #c3c2b7;
    --border: rgba(1, 33, 105, 0.12);
    --duke: #012169;        /* Duke navy: chrome, emphasis */
    --duke-2: #00539b;      /* Duke royal blue: links */
    --duke-tint: #eef2f9;
    --cards: #2a78d6;       /* series 1: bank credit cards */
    --affirm: #eb6834;      /* series 2: Affirm (BNPL) */
    --nco: #1baf7a;         /* series 3: card charge-offs */
    --bar-idle: #c9cbd3;
    --good: #0ca30c;  --warning: #fab219;  --critical: #d03b3b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
  a { color: var(--duke-2); }
  button { font: inherit; }

  /* Header + page tabs */
  .top { background: var(--duke); color: #fff; }
  .top .inner { max-width: 1320px; margin: 0 auto; padding: 14px 24px 0; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
  .brand .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
  .brand .name { font-size: 20px; font-weight: 650; letter-spacing: -.01em; margin: 2px 0 12px; }
  .vintage { font-size: 12px; opacity: .8; margin-bottom: 12px; text-align: right; }
  .tabs { display: flex; gap: 2px; max-width: 1320px; margin: 0 auto; padding: 0 24px; overflow-x: auto; }
  .tabs a { color: #fff; text-decoration: none; padding: 9px 18px 10px; border-radius: 8px 8px 0 0; font-size: 14px; opacity: .8; display: flex; gap: 8px; align-items: baseline; white-space: nowrap; }
  .tabs a small { font-size: 11px; opacity: .8; }
  .tabs a:hover { opacity: 1; background: rgba(255,255,255,.08); }
  .tabs a[aria-current=page] { background: var(--page); color: var(--duke); opacity: 1; font-weight: 600; }

  .wrap { max-width: 1320px; margin: 0 auto; padding: 20px 24px 36px; }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
  .s12 { grid-column: span 12; } .s8 { grid-column: span 8; } .s7 { grid-column: span 7; } .s6 { grid-column: span 6; }
  .s5 { grid-column: span 5; } .s4 { grid-column: span 4; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; min-width: 0; }
  .panel h2 { font-size: 17px; line-height: 1.3; margin: 0 0 4px; }
  .panel .desc { color: var(--ink-2); font-size: 13px; margin: 0 0 8px; }
  .kicker { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--duke); font-weight: 650; margin: 0 0 6px; }
  .page-intro { display: flex; justify-content: space-between; align-items: baseline; gap: 8px 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .page-intro h1 { font-size: 24px; margin: 0; letter-spacing: -.01em; }
  .page-intro p { margin: 0; color: var(--ink-2); font-size: 14px; }
  .hint { color: var(--muted); font-size: 12px; }

  /* Executive conclusion card */
  .conclusion { border-left: 5px solid var(--duke); cursor: pointer; transition: box-shadow .15s; }
  .conclusion:hover, .conclusion:focus-visible { box-shadow: 0 2px 14px rgba(1,33,105,.14); outline: none; }
  .conclusion h2 { font-size: 21px; }
  .big { font-size: 56px; font-weight: 700; line-height: 1; letter-spacing: -.02em; color: var(--duke); font-variant-numeric: tabular-nums; margin: 12px 0 4px; }
  .big small { font-size: 20px; font-weight: 600; color: var(--ink); letter-spacing: 0; }
  .peaks { display: flex; gap: 6px 22px; flex-wrap: wrap; margin: 10px 0 14px; font-size: 14px; color: var(--ink-2); }
  .peaks b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; flex: none; }
  .signal { display: flex; gap: 12px; align-items: center; border-top: 1px solid var(--grid); padding-top: 12px; flex-wrap: wrap; }
  .signal .txt { font-size: 14px; color: var(--ink-2); flex: 1; min-width: 200px; }
  .signal .txt b { color: var(--ink); }
  .status { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--axis); border-radius: 999px; padding: 2px 10px 2px 8px; font-size: 13px; font-weight: 600; white-space: nowrap; background: #fff; }
  .status i { font-style: normal; font-size: 11px; }
  .status.none i { color: var(--good); } .status.watch i { color: #b07800; } .status.trigger i { color: var(--critical); } .status.na i { color: var(--muted); }
  .drill-link { margin-top: 12px; font-size: 13px; color: var(--duke-2); font-weight: 600; }
  ol.recs { margin: 8px 0 0; padding-left: 0; list-style: none; counter-reset: r; display: grid; gap: 12px; }
  ol.recs li { counter-increment: r; display: grid; grid-template-columns: 30px 1fr; gap: 10px; }
  ol.recs li::before { content: counter(r); width: 26px; height: 26px; border-radius: 50%; background: var(--duke); color: #fff; font-weight: 700; font-size: 13px; display: grid; place-items: center; }
  ol.recs b { display: block; }
  ol.recs span { color: var(--ink-2); font-size: 14px; }
  .trust { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; background: var(--duke-tint); }
  .trust p { margin: 0; font-size: 15px; max-width: 820px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--duke); color: var(--duke); background: #fff; border-radius: 8px; padding: 7px 13px; font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer; white-space: nowrap; }
  .btn.primary { background: var(--duke); color: #fff; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn:not(:disabled):hover { background: var(--duke-tint); }
  .btn.primary:hover { background: var(--duke-2); }

  /* Slicer bar (analyst) */
  .slicers { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-end; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; }
  .slicer { display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); }
  .slicer > span:first-child { font-weight: 600; letter-spacing: .02em; }
  select { font: inherit; font-size: 14px; padding: 5px 8px; border: 1px solid var(--axis); border-radius: 7px; background: #fff; color: var(--ink); }
  .seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 8px; overflow: hidden; background: #fff; }
  .seg button { border: 0; background: transparent; padding: 6px 11px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--axis); }
  .seg button[aria-pressed=true] { background: var(--duke); color: #fff; }
  input[type=range] { width: 190px; accent-color: var(--duke); }
  .readout { font-variant-numeric: tabular-nums; font-weight: 650; font-size: 14px; color: var(--ink); min-width: 190px; }

  /* Tables */
  .tbl-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-weight: 600; color: var(--ink-2); border-bottom: 1px solid var(--axis); padding: 6px 8px; white-space: nowrap; background: #fff; position: sticky; top: 0; }
  td { border-bottom: 1px solid var(--grid); padding: 6px 8px; vertical-align: top; }
  td.n, th.n { text-align: right; }
  tr.row-link { cursor: pointer; }
  tr.row-link:hover td { background: var(--duke-tint); }
  tr.dim td { color: var(--muted); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  .verdict { font-weight: 650; white-space: nowrap; }
  .verdict.Hold i { color: var(--good); } .verdict.Narrow i { color: #b07800; } .verdict.Fail i { color: var(--critical); }
  .verdict i { font-style: normal; font-size: 11px; margin-right: 5px; }
  .formula { background: #f7f8fb; border: 1px solid var(--grid); border-radius: 8px; padding: 10px 12px; margin: 0; overflow-x: auto; line-height: 1.6; }
  .formula b { color: var(--duke); font-weight: 650; }

  /* Regulator */
  .vint { display: grid; grid-template-columns: repeat(5, 1fr) 1.5fr; }
  .vint div { padding: 2px 14px; border-left: 1px solid var(--grid); }
  .vint div:first-child { border-left: 0; padding-left: 0; }
  .vint b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--duke); }
  .vint span { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
  ul.plain { margin: 6px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 14px; display: grid; gap: 4px; }

  /* Drill-through */
  .crumb { display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; background: var(--duke-tint); border: 1px solid var(--border); border-radius: 999px; padding: 4px 5px 4px 12px; font-size: 13px; }
  .chip b { color: var(--duke); }
  .chip button { border: 0; background: var(--duke); color: #fff; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; line-height: 1; font-size: 11px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .tile .l { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; }
  .tile .v { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; margin: 2px 0; }
  .tile .s { font-size: 12px; color: var(--muted); }
  dl.src { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 6px 0 0; font-size: 14px; }
  dl.src dt { color: var(--ink-2); }
  dl.src dd { margin: 0; overflow-wrap: anywhere; }
  .chain { counter-reset: st; }
  .step { display: grid; grid-template-columns: 34px 1fr; gap: 12px; position: relative; padding-bottom: 16px; }
  .step::before { counter-increment: st; content: counter(st); width: 28px; height: 28px; border-radius: 50%; background: var(--duke); color: #fff; font-weight: 700; font-size: 13px; display: grid; place-items: center; z-index: 1; }
  .step:not(:last-child)::after { content: ""; position: absolute; left: 13px; top: 28px; bottom: 0; width: 2px; background: var(--border); }
  .step h3 { margin: 3px 0 2px; font-size: 14px; }
  .step p { margin: 0; color: var(--ink-2); font-size: 14px; overflow-wrap: anywhere; }
  .nav-pn { display: flex; gap: 8px; margin-left: auto; }

  footer { color: var(--muted); font-size: 12px; margin-top: 22px; border-top: 1px solid var(--grid); padding-top: 12px; display: grid; gap: 3px; }
  footer b { color: var(--ink-2); font-weight: 600; margin-right: 4px; }
  abbr[title] { text-decoration: underline dotted; text-decoration-color: var(--muted); text-underline-offset: 2px; cursor: help; }
  dl.gloss { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px 24px; margin: 6px 0 0; font-size: 13px; }
  dl.gloss div { display: grid; grid-template-columns: 92px 1fr; gap: 8px; }
  dl.gloss dt { font-weight: 650; color: var(--duke); }
  dl.gloss dd { margin: 0; color: var(--ink-2); }
  kbd { font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--axis); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: #fff; color: var(--ink-2); }
  .vintage { display: flex; gap: 16px; align-items: center; opacity: 1; }
  .vintage span { opacity: .8; }
  .btn.export { background: transparent; color: #fff; border-color: rgba(255,255,255,.55); padding: 5px 11px; font-size: 13px; }
  .btn.export:hover { background: rgba(255,255,255,.12); }

  /* Print view (#print): all three pages at landscape-letter width */
  body.print-mode .wrap { width: 980px; max-width: none; padding-left: 0; padding-right: 0; }
  body.print-mode .grid { grid-template-columns: repeat(12, 1fr); }
  body.print-mode .s12 { grid-column: span 12; } body.print-mode .s8 { grid-column: span 8; } body.print-mode .s7 { grid-column: span 7; }
  body.print-mode .s6 { grid-column: span 6; } body.print-mode .s5 { grid-column: span 5; } body.print-mode .s4 { grid-column: span 4; }
  body.print-mode #s-reset { display: none; }
  .print-banner { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--duke-tint); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; margin-bottom: 16px; font-size: 14px; }
  .print-banner span { flex: 1; }
  .print-page + .print-page { margin-top: 28px; break-before: page; }
  @media print {
    @page { size: letter landscape; margin: 0.35in; }
    body { background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .tabs, .btn, .hint, .drill-link, .print-banner, .keys, .nav-pn { display: none !important; }
    .wrap { max-width: none; padding: 0; }
    body.print-mode .wrap { width: 980px; padding: 0; }
    .top .inner { padding: 6px 0 4px; }
    .panel { break-inside: avoid; }
    .grid { grid-template-columns: repeat(12, 1fr) !important; }
    .s12 { grid-column: span 12 !important; } .s8 { grid-column: span 8 !important; } .s7 { grid-column: span 7 !important; }
    .s6 { grid-column: span 6 !important; } .s5 { grid-column: span 5 !important; } .s4 { grid-column: span 4 !important; }
    .vint { grid-template-columns: repeat(5, 1fr) 1.5fr !important; }
    .no-print { display: none !important; }
    .tbl-wrap { overflow: visible; }
    table { font-size: 10px; }
    td, th { padding: 3px 6px; }
    .formula { white-space: pre-wrap; font-size: 9.5px; }
    table.register td { white-space: nowrap; font-size: 9px; }
    table.register .mono { font-size: 9px; }
    th { position: static; }
  }
  @media (max-width: 960px) {
    .grid { grid-template-columns: minmax(0, 1fr); }
    .s12, .s8, .s7, .s6, .s5, .s4 { grid-column: auto; }
    .vint { grid-template-columns: 1fr 1fr; gap: 8px; }
    .vint div { border-left: 0; padding-left: 0; }
    .big { font-size: 44px; }
    .wrap, .top .inner, .tabs { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="inner">
    <div class="brand">
      <div class="eyebrow">Project Audible · FINTECH 590.05 · Duke University</div>
      <div class="name">Is <abbr title="Buy now, pay later: short installment loans at checkout (Affirm, Klarna, Afterpay)">BNPL</abbr> masking consumer credit stress?</div>
    </div>
    <div class="vintage" id="vintage"></div>
  </div>
  <nav class="tabs" id="tabs">
    <a href="#executive" data-page="executive">Executive <small>decide</small></a>
    <a href="#analyst" data-page="analyst">Analyst <small>test the method</small></a>
    <a href="#regulator" data-page="regulator">Regulator <small>trace the source</small></a>
  </nav>
</header>
<div class="wrap">
  <main id="app"></main>
  <footer id="foot"></footer>
</div>

<script>
// ============================================================ data model
const D = window.DASH, K = D.kpi, T = D.trigger, M = D.meta, Q = D.quarters;
const N = Q.length, LAST = N - 1;
const byDate = Object.fromEntries(Q.map((q, i) => [q.date, i]));
const AFFIRM = {
  affirm30: { name: 'Affirm 30+ DPD rate', short: 'Affirm 30+ DPD', unit: '%', field: 'affirm_quarterly.csv · delinquency_30plus_pct' },
  affirm90: { name: 'Affirm 90+ DPD rate', short: 'Affirm 90+ DPD', unit: '%', field: 'affirm_quarterly.csv · delinquency_90plus_pct' },
  del_usd_mil: { name: 'Affirm 30+ DPD balances ($M)', short: 'Affirm 30+ DPD $', unit: '$M', field: '30+ DPD rate × loans_held_for_investment_mil' },
};
const CARD = {
  cc30: { name: 'Card 30+ DPD rate', short: 'Card 30+ DPD', unit: '%', field: 'FRED DRCCLACBS', color: 'cards' },
  nco: { name: 'Card net charge-off rate', short: 'Card charge-offs', unit: '%', field: 'FRED CORCCACBS', color: 'nco' },
};

// ============================================================ formatting
const $ = s => document.querySelector(s);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C = Object.fromEntries(['cards', 'affirm', 'nco', 'ink', 'ink-2', 'muted', 'grid', 'axis', 'bar-idle', 'duke', 'duke-2', 'critical']
  .map(k => [k.replace('-', ''), css('--' + k)]));
const pct = (v, d = 2) => v == null ? '—' : v.toFixed(d) + '%';
const pp = v => v == null ? '—' : (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2) + ' pp';
const pts = v => v == null ? '—' : (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2) + ' points';
const rr = v => v == null ? '—' : (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const qWord = n => `${n} quarter${n === 1 ? '' : 's'}`;
const aQ = n => `${n === 8 || n === 11 || n === 18 ? 'an' : 'a'} ${n}-quarter`;
function addQ(iso, n) {
  const [y, m] = iso.split('-').map(Number);
  const t = y * 12 + (m - 1) + 3 * n, yy = Math.floor(t / 12), mm = t % 12 + 1;
  return new Date(Date.UTC(yy, mm, 0)).toISOString().slice(0, 10);
}
const addDays = (iso, d) => new Date(Date.parse(iso) + d * 864e5).toISOString().slice(0, 10);
const STATUS = {
  none: { icon: '●', text: 'No trigger' }, watch: { icon: '▲', text: 'Watch' },
  trigger: { icon: '■', text: 'Trigger' }, 'n/a': { icon: '–', text: 'No year-ago filing' },
};
const statusChip = s => `<span class="status ${s === 'n/a' ? 'na' : s}"><i aria-hidden="true">${STATUS[s].icon}</i>${STATUS[s].text}</span>`;
const verdict = v => `<span class="verdict ${v}"><i aria-hidden="true">${v === 'Hold' ? '●' : v === 'Narrow' ? '▲' : '■'}</i>${v}</span>`;
const trig = `+${T.trigger_pp.toFixed(2)} pp`;
// Hover definitions for analyst/regulator terms; the executive page spells things out instead.
const TERMS = {
  BNPL: 'Buy now, pay later: short installment loans at checkout',
  DPD: 'Days past due. 30+ DPD = share of balances at least 30 days late',
  pp: 'Percentage points: the change between two percentages',
  YoY: 'Year over year: this quarter minus the same quarter a year earlier',
  'Q-o-Q': 'Quarter over quarter: this quarter minus the previous one',
  r: 'Pearson correlation, from −1 to +1',
  n: 'Number of quarter pairs behind a correlation',
  CI: 'Confidence interval: the range the true value plausibly falls in (95%)',
  NCO: 'Net charge-offs: balances written off as losses, net of recoveries, annualized',
  FRED: 'Federal Reserve Economic Data, St. Louis Fed',
  EDGAR: "The SEC's public filing database",
  '10-K': 'Annual report filed with the SEC',
  '10-Q': 'Quarterly report filed with the SEC',
  HFI: 'Loans held for investment (kept on the balance sheet)',
  UPB: 'Unpaid principal balance',
};
const ab = (t, label = t) => `<abbr title="${esc(TERMS[t])}">${label}</abbr>`;
const glossary = keys => `<section class="panel s12"><h2>Terms</h2><dl class="gloss">${keys.map(k =>
  `<div><dt>${k}</dt><dd>${esc(TERMS[k])}</dd></div>`).join('')}</dl></section>`;

// ============================================================ measures (recomputed live from the same rows as the build)
function pearson(x, y) {
  const n = x.length;
  if (n < 3) return null;
  const mx = x.reduce((a, b) => a + b) / n, my = y.reduce((a, b) => a + b) / n;
  let sxy = 0, sxx = 0, syy = 0;
  for (let i = 0; i < n; i++) { const dx = x[i] - mx, dy = y[i] - my; sxy += dx * dy; sxx += dx * dx; syy += dy * dy; }
  return sxx && syy ? sxy / Math.sqrt(sxx * syy) : null;
}
function fisher(r, n) {
  if (r == null || n <= 3) return [null, null];
  const z = Math.atanh(r), se = 1 / Math.sqrt(n - 3);
  return [Math.tanh(z - 1.96 * se), Math.tanh(z + 1.96 * se)];
}
function acf(x, j) {
  const m = x.reduce((a, b) => a + b) / x.length, d = x.map(v => v - m);
  let num = 0, den = 0;
  d.forEach((v, i) => { den += v * v; if (i + j < d.length) num += v * d[i + j]; });
  return num / den;
}
// Pyper & Peterman (1998) effective pairs: slow-moving series share less information
// than their pair count. Floored at 4 so the interval exists, capped at n.
function nEff(x, y) {
  const n = x.length;
  let s = 0;
  for (let j = 1; j <= Math.floor(n / 5); j++) s += acf(x, j) * acf(y, j);
  return 1 + 2 * s > 0 ? Math.min(n, Math.max(4, n / (1 + 2 * s))) : n;
}
// Pairs Affirm at quarter t with cards at t+lag inside the [s, e] window.
// Changes are differenced inside the window, as lead_lag.py does.
function lagPairs(aKey, cKey, lag, mode, s = 0, e = LAST) {
  let a = Q.slice(s, e + 1).map(q => q[aKey]), c = Q.slice(s, e + 1).map(q => q[cKey]);
  if (mode === 'changes') {
    const d = v => v.map((x, i) => i === 0 || x == null || v[i - 1] == null ? null : x - v[i - 1]);
    a = d(a); c = d(c);
  }
  const pairs = [];
  for (let i = 0; i + lag < a.length; i++)
    if (a[i] != null && c[i + lag] != null) pairs.push({ i: s + i, j: s + i + lag, a: a[i], c: c[i + lag] });
  return pairs;
}
function lagStat(aKey, cKey, lag, mode, s, e) {
  const p = lagPairs(aKey, cKey, lag, mode, s, e), r = pearson(p.map(d => d.a), p.map(d => d.c));
  const [lo, hi] = fisher(r, p.length);
  const ne = p.length > 3 ? nEff(p.map(d => d.a), p.map(d => d.c)) : null;
  const [loA, hiA] = ne ? fisher(r, ne) : [null, null];
  return { lag, r, n: p.length, lo, hi, ne, loA, hiA, pairs: p };
}
const lagTable = (aKey, cKey, mode, s, e) => [...Array(11).keys()].map(l => lagStat(aKey, cKey, l, mode, s, e));
const bestOf = rows => rows.filter(r => r.r != null).reduce((a, b) => (!a || b.r > a.r ? b : a), null);

    hovertemplate: `${A.short}, %{text}: <b>${valFmt}</b><br><span style="color:#7a7974">${A.field} · pulled ${M.sec_pulled}</span><extra></extra>` };
  const cColor = C[Cc.color];
  const cT = { name: Cc.short, x: Q.map(q => q.date), y: Q.map((q, i) => inWin(i) ? q[S.c] : null), mode: 'lines+markers',
    line: { color: cColor, width: 2.5 }, marker: { size: 7, color: cColor, line: { color: '#fff', width: 2 } },
    customdata: Q.map((q, i) => i), text: Q.map(q => q.label), yaxis: same ? 'y' : 'y2',
    hovertemplate: `${Cc.short}, %{text}: <b>%{y:.2f}%</b><br><span style="color:#7a7974">${Cc.field} · pulled ${M.fred_pulled}</span><extra></extra>` };
  const lay = base({ hovermode: 'x unified', xaxis: xAxis({ range: [addQ(Q[S.s].date, -1), addQ(Q[S.e].date, Math.max(1, S.lag + 1))], anchor: same ? 'y' : 'y2' }) });
  if (same) lay.yaxis = yAxis('% of balances', yMax([S.a, S.c]));
  else {
    lay.yaxis = { ...yAxis(A.short, yMax([S.a]), A.unit), domain: [0.56, 1] };
    lay.yaxis2 = { ...yAxis(Cc.short, yMax([S.c]), Cc.unit), domain: [0, 0.42] };
  }
  if (first) plot('c-shift', [cT, aT], lay, p => go(`drill/quarter/${Q[p.customdata].date}`, 'analyst'));
  else Plotly.react('c-shift', [cT, aT], lay, cfg);

  // Correlation by lag with confidence intervals
  $('#t-corr').textContent = !bst ? `Not enough overlap in ${win} for a lag test`
    : `Correlation peaks at ${aQ(bst.lag)} lead (r = ${rr(bst.r)})`;
  const bars = [{ type: 'bar', x: rows.map(r => r.lag), y: rows.map(r => r.r),
    marker: { color: rows.map(r => r.lag === S.lag ? C.duke : C.baridle), line: { color: '#fff', width: 2 } },
    error_y: { type: 'data', symmetric: false, array: rows.map(r => r.hiA != null ? r.hiA - r.r : 0),
      arrayminus: rows.map(r => r.loA != null ? r.r - r.loA : 0), color: C.ink2, thickness: 1.2, width: 4 },
    customdata: rows.map(r => [r.n, r.ne == null ? NaN : r.ne, r.loA ?? NaN, r.hiA ?? NaN, r.lo ?? NaN, r.hi ?? NaN]),
    hovertemplate: 'Affirm leads by %{x}Q<br>r = <b>%{y:+.2f}</b> (n = %{customdata[0]}, ≈%{customdata[1]:.0f} effective)' +
      '<br>Adjusted 95% CI %{customdata[2]:+.2f} to %{customdata[3]:+.2f}<br><span style="color:#7a7974">If pairs were independent: %{customdata[4]:+.2f} to %{customdata[5]:+.2f}</span><extra></extra>' }];
  const corrLay = base({ showlegend: false, bargap: 0.28, margin: { l: 48, r: 10, t: 10, b: 44 },
    annotations: rows.map(r => ({ x: r.lag, y: -1, yanchor: 'bottom', yshift: 2, showarrow: false,
      text: `${r.n}<br>≈${r.ne == null ? '–' : Math.round(r.ne)}`, font: { size: 10, color: C.muted } })),
    xaxis: { title: { text: 'Affirm leads cards by (quarters)', font: { size: 12 } }, dtick: 1, tickfont: { color: C.muted }, linecolor: C.axis },
    yaxis: { title: { text: 'Correlation (r)', font: { size: 12 } }, range: [-1, 1], dtick: 0.5, gridcolor: C.grid, zeroline: true, zerolinecolor: C.ink2, tickfont: { color: C.muted } } });
  if (first) plot('c-corr', bars, corrLay, p => go(`drill/lag/${p.x}?mode=${S.mode}&a=${S.a}&c=${S.c}&s=${S.s}&e=${S.e}`, 'analyst'));
  else Plotly.react('c-corr', bars, corrLay, cfg);

  // Row-level table
  $('#detail').innerHTML = `<tr><th>Quarter</th><th class="n">Affirm 30+</th><th class="n">Affirm 90+</th><th class="n">Book $M</th><th class="n">30+ ${ab('DPD')} $M</th>
    <th class="n">${ab('YoY')}</th><th>Signal</th><th class="n">Card 30+</th><th class="n">Card ${ab('NCO')}</th><th>Affirm basis</th><th>Source filing</th></tr>` +
    Q.map((q, i) => `<tr class="row-link ${inWin(i) ? '' : 'dim'}" data-i="${i}"><td>${q.label}</td><td class="n">${pct(q.affirm30)}</td><td class="n">${pct(q.affirm90)}</td>
    <td class="n">${q.loans_mil == null ? '—' : q.loans_mil.toLocaleString('en-US', { maximumFractionDigits: 0 })}</td><td class="n">${q.del_usd_mil == null ? '—' : q.del_usd_mil.toFixed(0)}</td>
    <td class="n">${pp(q.yoy_pp)}</td><td>${statusChip(q.signal)}</td><td class="n">${pct(q.cc30)}</td><td class="n">${pct(q.nco)}</td>
    <td class="mono">${q.basis || '—'}</td><td class="mono">${q.form ? q.form + ' ' + q.accession : 'not reported'}</td></tr>`).join('');
  document.querySelectorAll('#detail tr.row-link').forEach(tr => tr.onclick = () => go(`drill/quarter/${Q[+tr.dataset.i].date}`, 'analyst'));
}

// ============================================================ DRILL-THROUGH: one quarter
function drillQuarter(date) {
  const i = byDate[date] ?? LAST, q = Q[i], prev = Q[i - 1], later = Q[i + K.lead_q];
  const neutral = origin === 'regulator';
  const step = j => `go('drill/quarter/${Q[j].date}','${origin}')`;
  APP().innerHTML = crumb('Quarter', q.label, `<span class="nav-pn">
      <button class="btn" ${i === 0 ? 'disabled' : ''} onclick="${step(Math.max(0, i - 1))}">← Previous</button>
      <button class="btn" ${i === LAST ? 'disabled' : ''} onclick="${step(Math.min(LAST, i + 1))}">Next →</button></span>`) + `
  <div class="page-intro"><h1>${q.label}${q.affirm30 == null ? ': no Affirm filing reports this quarter' : ''}</h1>
    <p>${neutral ? 'Reported values and their source documents.' : `Affirm signal this quarter: ${STATUS[q.signal].text.toLowerCase()}.`}</p></div>
  <div class="tiles">
    <div class="tile"><div class="l"><span class="swatch" style="background:var(--affirm)"></span>Affirm 30+ DPD</div><div class="v">${pct(q.affirm30)}</div>
      <div class="s">${prev && prev.affirm30 != null && q.affirm30 != null ? `${pp(q.affirm30 - prev.affirm30)} vs ${prev.label}` : 'no prior quarter to compare'}</div></div>
    <div class="tile"><div class="l">Affirm year-over-year change</div><div class="v">${pp(q.yoy_pp)}</div><div class="s">${statusChip(q.signal)}</div></div>
    <div class="tile"><div class="l">Affirm 90+ DPD</div><div class="v">${pct(q.affirm90)}</div><div class="s">severe delinquency</div></div>
    <div class="tile"><div class="l">Affirm loan book</div><div class="v">${q.loans_mil == null ? '—' : '$' + (q.loans_mil / 1000).toFixed(2) + 'B'}</div><div class="s">${q.del_usd_mil == null ? '' : '$' + q.del_usd_mil.toFixed(0) + 'M is 30+ days past due'}</div></div>
    <div class="tile"><div class="l"><span class="swatch" style="background:var(--cards)"></span>Card 30+ DPD</div><div class="v">${pct(q.cc30)}</div>
      <div class="s">${prev ? `${pp(q.cc30 - prev.cc30)} vs ${prev.label}` : ''}</div></div>
    <div class="tile"><div class="l"><span class="swatch" style="background:var(--nco)"></span>Card net charge-offs</div><div class="v">${pct(q.nco)}</div><div class="s">annualized</div></div>
    ${neutral ? '' : `<div class="tile"><div class="l">Cards ${qWord(K.lead_q)} later</div><div class="v">${later ? pct(later.cc30) : '—'}</div><div class="s">${later ? later.label : 'beyond the data'}</div></div>`}
  </div>
  <div class="grid" style="margin-top:16px">
    <section class="panel s7"><h2>${q.label} in context</h2><p class="desc">The vertical line marks the selected quarter${neutral ? '' : `; the ring marks card delinquency ${qWord(K.lead_q)} later`}.

    <section class="panel s5"><h2>Sources for this quarter</h2>
      <h3 style="font-size:14px;margin:10px 0 0">Affirm</h3>
      ${q.form ? `<dl class="src">
        <dt>Document</dt><dd>${q.form}, filed ${q.filed}</dd>
        <dt>Column used</dt><dd>${q.filing_period === q.date ? 'Current period' : `Comparative column in the filing for ${q.filing_period}`}</dd>

      <h3 style="font-size:14px;margin:14px 0 0">Credit cards</h3>
      <dl class="src"><dt>Series</dt><dd>FRED DRCCLACBS (30+ DPD), CORCCACBS (charge-offs)</dd><dt>Observation</dt><dd>${q.fred_obs_date}, quarterly</dd>

// ============================================================ DRILL-THROUGH: one lag
function drillLag(lagArg, P) {
  const lag = Math.max(0, Math.min(10, +lagArg || 0)), mode = P.mode === 'changes' ? 'changes' : 'levels';
  const a = AFFIRM[P.a] ? P.a : 'affirm30', c = CARD[P.c] ? P.c : 'cc30';
  const s = P.s != null ? +P.s : 0, e = P.e != null ? +P.e : LAST, st = lagStat(a, c, lag, mode, s, e);
  const A = AFFIRM[a], Cc = CARD[c], keep = `mode=${mode}&a=${a}&c=${c}&s=${s}&e=${e}`;
  const nav = l => `go('drill/lag/${l}?${keep}','${origin}')`;
  APP().innerHTML = crumb('Affirm lead', qWord(lag), `<span class="nav-pn">
      <button class="btn" ${lag === 0 ? 'disabled' : ''} onclick="${nav(Math.max(0, lag - 1))}">← ${Math.max(0, lag - 1)}Q</button>
      <button class="btn" ${lag === 10 ? 'disabled' : ''} onclick="${nav(Math.min(10, lag + 1))}">${Math.min(10, lag + 1)}Q →</button></span>`) + `
  <div class="page-intro"><h1>${st.r == null ? 'Too few quarter pairs at this lead' : `At ${aQ(lag)} lead, r = ${rr(st.r)}`}</h1>
    <p>${st.n} pairs, ≈${st.ne == null ? '–' : Math.round(st.ne)} independent · 95% ${ab('CI')} ${rr(st.loA)} to ${rr(st.hiA)} · ${mode === 'levels' ? 'levels' : 'quarterly changes'}, ${Q[s].label}–${Q[e].label}</p></div>
  <div class="grid">
    <section class="panel s7"><h2>Each dot is one quarter pair</h2>
      <p class="desc">${A.short} at quarter t vs. ${Cc.short} ${qWord(lag)} later. Neighbouring quarters overlap, so the range above is adjusted
        (unadjusted: ${st.lo == null ? '—' : `${rr(st.lo)} to ${rr(st.hi)}`}). <span class="hint">Click a dot for its quarter.</span></p>
      <div id="dl" style="height:400px"></div></section>
    <section class="panel s5"><h2>The ${st.n} pairs behind the number</h2>
      <div class="tbl-wrap" style="max-height:420px;overflow-y:auto"><table>
        <tr><th>Affirm quarter</th><th class="n">${A.short}</th><th>Card quarter</th><th class="n">${Cc.short}</th></tr>
        ${st.pairs.map(p => `<tr class="row-link" data-d="${Q[p.i].date}"><td>${Q[p.i].label}</td><td class="n">${p.a.toFixed(2)}</td><td>${Q[p.j].label}</td><td class="n">${p.c.toFixed(2)}</td></tr>`).join('')}
      </table></div></section>
    ${origin === 'executive' ? `<section class="panel s12 trust"><p>The peaks are ${qWord(K.lead_q)} apart, and correlation is highest at a ${K.best_changes.lag}–${K.best_levels.lag} quarter lead: the two tests agree.
      Both rest on one credit cycle.</p>
      <a class="btn primary" href="#analyst">Test other windows on the Analyst page →</a></section>` : ''}
  </div>`;
  const unitTxt = mode === 'changes' ? ' change' : '';
  plot('dl', [{ x: st.pairs.map(p => p.a), y: st.pairs.map(p => p.c), mode: 'markers+text', type: 'scatter',
    text: st.pairs.map(p => Q[p.i].label.replace(' 20', " '")), textposition: 'top center', textfont: { size: 10, color: C.muted },
    marker: { size: 11, color: C.duke, line: { color: '#fff', width: 2 } }, customdata: st.pairs.map(p => [Q[p.i].label, Q[p.j].label, p.i]),
    hovertemplate: `${A.short} %{customdata[0]}: <b>%{x:.2f}</b><br>${Cc.short} %{customdata[1]}: <b>%{y:.2f}</b><extra></extra>` }],
    base({ showlegend: false, hovermode: 'closest', margin: { l: 60, r: 20, t: 10, b: 50 },
      xaxis: { title: { text: `${A.short}${unitTxt} at quarter t (${A.unit === '%' ? '%' : '$M'})`, font: { size: 12 } }, gridcolor: C.grid, zeroline: mode === 'changes', zerolinecolor: C.axis, tickfont: { color: C.muted } },
      yaxis: { title: { text: `${Cc.short}${unitTxt} at t + ${lag} (%)`, font: { size: 12 } }, gridcolor: C.grid, zeroline: mode === 'changes', zerolinecolor: C.axis, tickfont: { color: C.muted } } }),
    p => go(`drill/quarter/${Q[p.customdata[2]].date}`, origin));
  document.querySelectorAll('tr.row-link[data-d]').forEach(tr => tr.onclick = () => go(`drill/quarter/${tr.dataset.d}`, origin));
}

// ============================================================ DRILL-THROUGH: one headline figure's lineage
function drillMetric(id) {
  const pk = Q[byDate[K.affirm_peak_date]], cp = Q[byDate[K.cc_peak_date]], lt = Q[LAST], ya = Q[LAST - 4];
  const affirmChain = (q, measure) => [
    ['Source document', `Affirm Holdings ${q.form} for the period ending ${q.filing_period}, filed ${q.filed}. Accession <a class="mono" href="${q.edgar_url}" target="_blank" rel="noopener">${q.accession}</a>.`],
    ['Table read', `Aging analysis of loans by delinquency status. Basis: ${esc(D.basis_labels[q.basis])}.`],
    ['Raw file', `data/raw/affirm/${q.accession}/ (regenerate with scripts/fetch_affirm_filings.py; SEC pulled ${M.sec_pulled})`],
    ['Transform', 'scripts/parse_affirm_delinquency.py: (30–59 + 60–89 + 90–119 days past due) ÷ total. The script stops if the buckets do not sum to the total.'],
    ['Processed row', `data/processed/affirm_quarterly.csv, quarter_end ${q.date}, delinquency_30plus_pct = ${q.affirm30}`],
    ['Measure', measure]];
  const fredChain = (q, measure) => [
    ['Source series', `FRED DRCCLACBS, Delinquency Rate on Credit Card Loans, All Commercial Banks (Board of Governors). Observation ${q.fred_obs_date}.`],
    ['Raw file', `data/raw/DRCCLACBS.csv from fred.stlouisfed.org/graph/fredgraph.csv?id=DRCCLACBS, pulled ${M.fred_pulled}`],
    ['Transform', 'scripts/pull_fred.py: last observation in each quarter, dated to quarter end'],
    ['Processed row', `data/processed/fred_quarterly.csv, quarter ${q.date}, cc_30plus_dpd_rate_pct = ${q.cc30}`],
    ['Measure', measure]];
  const corrChain = b => [
    ['Inputs', `Affirm 30+ DPD and card 30+ DPD, ${Q[0].label}–${Q[LAST].label}, from the two processed files`],
    ['Method', 'scripts/lead_lag.py: Pearson correlation of Affirm at t with cards at t + N for N = 0–10; quarters missing on either side dropped pairwise'],
    ['Result', `r = ${b.r.toFixed(3)} at N = ${b.lag}, n = ${b.n} pairs; 95% CI ${rr(b.lo)} to ${rr(b.hi)} (Fisher z) if pairs were independent`],
    ['Overlap adjustment', `scripts/build_dashboard_data.py: autocorrelation in both series leaves about ${b.n_eff} effective pairs (Pyper & Peterman 1998); adjusted 95% CI ${rr(b.lo_adj)} to ${rr(b.hi_adj)}`]];
  const L = {
    affirm_peak: { t: 'Highest Affirm 30+ DPD rate', v: `${pct(K.affirm_peak)} in ${K.affirm_peak_label}`, steps: affirmChain(pk, `MAX over all quarters = ${pct(K.affirm_peak)}`), cmd: 'python scripts/fetch_affirm_filings.py\npython scripts/parse_affirm_delinquency.py' },
    cc_peak: { t: 'Highest card 30+ DPD rate', v: `${pct(K.cc_peak)} in ${K.cc_peak_label}`, steps: fredChain(cp, `MAX over ${Q[0].label}–${Q[LAST].label} = ${pct(K.cc_peak)}`), cmd: 'python scripts/pull_fred.py' },
    lead: { t: 'Quarters between the two highs', v: qWord(K.lead_q), steps: [
      ['Affirm high', `${K.affirm_peak_label} (${pct(K.affirm_peak)}), from ${srcLine(byDate[K.affirm_peak_date])}`],
      ['Card high', `${K.cc_peak_label} (${pct(K.cc_peak)}), from FRED DRCCLACBS observation ${cp.fred_obs_date}`],
      ['Measure', `(${cp.date.slice(0, 4)} − ${pk.date.slice(0, 4)}) × 4 + (${K.cc_peak_label[1]} − ${K.affirm_peak_label[1]}) = ${K.lead_q} quarters`]], cmd: 'python scripts/pull_fred.py\npython scripts/parse_affirm_delinquency.py' },
    best_levels: { t: 'Highest lagged correlation, levels', v: `r = ${K.best_levels.r.toFixed(3)} at ${aQ(K.best_levels.lag)} lag`, steps: corrChain(K.best_levels), cmd: 'python scripts/lead_lag.py' },
    best_changes: { t: 'Highest lagged correlation, quarter-over-quarter changes', v: `r = ${K.best_changes.r.toFixed(3)} at ${aQ(K.best_changes.lag)} lag`, steps: corrChain(K.best_changes), cmd: 'python scripts/lead_lag.py' },
    signal: { t: `Year-over-year change, ${lt.label}`, v: pp(T.latest.yoy_pp), steps: [
      ...affirmChain(lt, '').slice(0, 5),
      ['Year-ago row', `${ya.label}: delinquency_30plus_pct = ${ya.affirm30}, from ${srcLine(LAST - 4)}`],
      ['Measure', `${lt.affirm30} − ${ya.affirm30} = ${pp(T.latest.yoy_pp)}. Rule: ≥ ${T.trigger_pp.toFixed(2)} pp is a trigger, ≥ ${T.watch_pp.toFixed(2)} pp is watch, otherwise no trigger. Result: ${STATUS[T.latest.signal].text}.`]], cmd: 'python scripts/parse_affirm_delinquency.py' },
  }[id];
  if (!L) return go(origin);
  APP().innerHTML = crumb('Figure', L.t) + `
  <div class="page-intro"><h1>${L.t}: ${L.v}</h1><p>From the published source to the number on the page.</p></div>
  <div class="grid">
    <section class="panel s8"><div class="chain">${L.steps.map(([h, p]) => `<div class="step"><div><h3>${h}</h3><p>${p}</p></div></div>`).join('')}</div></section>
    <section class="panel s4"><h2>Reproduce it</h2><p class="desc">From the repository root:</p><pre class="formula mono">${L.cmd}\npython scripts/build_dashboard_data.py</pre>
      <p class="hint" style="margin-top:8px">Build ${M.built_at} · commit ${esc(M.commit)}</p></section>
  </div>`;
}

// ============================================================ boot
const fmtDate = iso => new Date(iso + 'T00:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
$('#vintage').innerHTML = `<span>Data through ${M.latest_label} · pulled ${fmtDate(M.sec_pulled)}<br>Next data ${M.next_data[0].expected}</span>
  <a class="btn export" href="#print?auto=1">Export PDF</a>`;
$('#foot').innerHTML = [
  '<b>Sources</b>Affirm Holdings 10-K and 10-Q filings (SEC EDGAR) · Federal Reserve Board series DRCCLACBS and CORCCACBS (via FRED)',
  '<b>Data</b>Every page reads one file, dashboard/data.js, built by scripts/build_dashboard_data.py',
  '<b>Team</b>Samruddhi Shrawne and Abhinav Sharaff · FINTECH 590.05, Duke University',
  '<span class="keys"><b>Keys</b><kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> switch pages · <kbd>←</kbd> <kbd>→</kbd> step through a drill-through · <kbd>Esc</kbd> go back</span>',
].map(l => `<div>${l}</div>`).join('');
render();
</script>
